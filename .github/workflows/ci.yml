# ============================================
# CI Build Pipeline
# ============================================
# Detta workflow bygger projektet vid varje push och PR
# för att säkerställa att koden kompilerar korrekt

name: CI Build

# ============================================
# När ska detta köra?
# ============================================
on:
  push:
    branches: [ main, master ]     # Kör när du pushar till main/master
  pull_request:                    # Kör på alla pull requests
    branches: [ main, master ]
  workflow_dispatch:               # Tillåt manuell körning från GitHub UI

# ============================================
# Globala miljövariabler
# ============================================
env:
  DOTNET_VERSION: '9.0.x'                    # Vilken .NET-version vi använder
  BUILD_CONFIGURATION: Release                # Release build (optimerad)
  BUILD_PLATFORM: x64                         # Platform for WinUI 3 projects
  SOLUTION_PATH: ./PomodoroTimeTracker.sln   # Sökväg till solution-fil

# ============================================
# Jobs - Vad ska göras?
# ============================================
jobs:
  # ------------------------------------------
  # JOB 1: Code Quality
  # ------------------------------------------
  # Körs först för att verifiera kodstil innan build
  code-quality:
    name: Code Quality Checks
    runs-on: windows-latest

    steps:
      # STEG 1: Hämta kod från repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEG 2: Installera .NET SDK
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # STEG 3: Restore dependencies (krävs för dotnet format)
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # STEG 4: Verifiera kodformatering
      - name: Verify code formatting
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity diagnostic
        continue-on-error: true              # Tillåt warnings för nu

  # ------------------------------------------
  # JOB 2: Build and Test
  # ------------------------------------------
  # Körs endast om code-quality lyckas
  build:
    needs: code-quality                      # Vänta på code-quality job
    name: Build and Test                     # Visningsnamn i GitHub UI
    runs-on: windows-latest                  # Kör på Windows (WinUI 3 kräver Windows)

    steps:
      # STEG 1: Hämta kod från repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                     # Hämta all git-historik

      # STEG 2: Installera .NET SDK
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # STEG 3: Visa installerad .NET-version (för debugging)
      - name: Display .NET info
        run: dotnet --info

      # STEG 4: Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }} -p:Platform=${{ env.BUILD_PLATFORM }}

      # STEG 5: Build solution
      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} -p:Platform=${{ env.BUILD_PLATFORM }} --no-restore

      # STEG 6: Run tests with coverage
      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} -p:Platform=${{ env.BUILD_PLATFORM }} --no-build --verbosity normal --collect:"XPlat Code Coverage"

      # STEG 7: Upload test coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false            # Fortsätt även om codecov upload failar
          verbose: true

      # STEG 8: Upload build output som artifact (kan laddas ner från GitHub)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pomodoro-build-${{ github.run_number }}
          path: |
            **/bin/${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/**
            !**/*.pdb
          retention-days: 30                 # Behåll i 30 dagar
